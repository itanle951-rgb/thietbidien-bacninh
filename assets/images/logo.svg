<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA7C11"/>
      <stop offset="100%" stop-color="#F3E5AB"/>
    </linearGradient>
    <linearGradient id="goldBright" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2234"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- LOGO ICON (Emblem / Shield Mark) -->
  <g transform="translate(10, 10)">
    <!-- Outer Hexagon / Shield with Gold Border -->
    <polygon points="50,2 94,26 94,74 50,98 6,74 6,26" fill="url(#shieldBg)" stroke="url(#goldLinear)" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Inner Accent Border -->
    <polygon points="50,9 86,29 86,71 50,91 14,71 14,29" fill="none" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.35" stroke-linejoin="round"/>
    
    <!-- Stylized "D" and "P" with integrated Lightning Bolt -->
    <!-- Letter D (Left Wing) -->
    <path d="M 27 28 L 44 28 C 50 28 53 32 50 38 L 45 46 C 43 49 39 50 35 50 L 27 50 Z" fill="url(#goldLinear)"/>
    <path d="M 33 34 L 40 34 C 42 34 43 36 42 38 L 40 42 C 39 44 37 44 35 44 L 33 44 Z" fill="#0F172A"/>

    <!-- Letter P (Right Wing) -->
    <path d="M 52 38 L 68 38 C 74 38 77 42 75 48 L 73 54 C 71 59 66 61 61 61 L 52 61 Z M 52 61 L 52 74 L 47 74 L 47 38 Z" fill="url(#goldLinear)"/>
    <path d="M 57 44 L 64 44 C 66 44 67 46 66 48 L 65 52 C 64 55 62 55 60 55 L 57 55 Z" fill="#0F172A"/>

    <!-- Center Electric Lightning Surge -->
    <polygon points="53,20 40,51 49,51 42,78 62,45 52,45" fill="url(#goldBright)" filter="url(#goldGlow)"/>
    <polygon points="53,20 40,51 49,51 42,78 62,45 52,45" fill="#FFFDEB"/>

    <!-- Dynamic Tech Spark Dots -->
    <circle cx="50" cy="98" r="2.5" fill="#38BDF8"/>
    <circle cx="50" cy="2" r="2.5" fill="#F3E5AB"/>
  </g>

  <!-- TYPOGRAPHY -->
  <!-- Brand Name: DUY PHONG -->
  <text x="125" y="52" fill="#FFFFFF" font-family="'Inter', 'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="2.5">
    DUY PHONG
  </text>
  
  <!-- Suffix: ELECTRICS in Metallic Gold -->
  <text x="368" y="52" fill="url(#goldLinear)" font-family="'Inter', 'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="3.5">
    ELECTRICS
  </text>

  <!-- Divider Line with Diamond Center -->
  <line x1="126" y1="67" x2="295" y2="67" stroke="url(#goldLinear)" stroke-width="1.8" stroke-opacity="0.7"/>
  <polygon points="305,67 308,63 311,67 308,71" fill="#FFE885"/>
  <line x1="321" y1="67" x2="510" y2="67" stroke="url(#goldLinear)" stroke-width="1.8" stroke-opacity="0.7"/>

  <!-- Subtitle: THIẾT BỊ ĐIỆN CAO CẤP • BẮC NINH -->
  <text x="126" y="86" fill="#F3E5AB" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="3.2">
    THIẾT BỊ ĐIỆN CAO CẤP
  </text>
  <circle cx="316" cy="83" r="2" fill="#38BDF8"/>
  <text x="328" y="86" fill="#94A3B8" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2.8">
    BẮC NINH
  </text>
</svg>
